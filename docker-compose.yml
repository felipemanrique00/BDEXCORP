name: bbt-corporativo

x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?Defina APP_URL}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Defina NEXT_PUBLIC_APP_URL}
  APP_VERSION: ${APP_VERSION:?Defina APP_VERSION}
  ALLOW_INSECURE_LOCALHOST: ${ALLOW_INSECURE_LOCALHOST:-false}
  DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
  POSTGRES_CONNECT_TIMEOUT_MS: ${POSTGRES_CONNECT_TIMEOUT_MS:-5000}
  POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
  AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET}
  AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-bbt_session}
  STORAGE_ROOT: /var/lib/bbt/files
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BBT Corporativo}
  PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution_api}
  WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-}
  WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
  WHATSAPP_INSTANCE_ID: ${WHATSAPP_INSTANCE_ID:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
  OPENAI_PRO_MODEL: ${OPENAI_PRO_MODEL:-gpt-5.2-pro}
  OPENAI_SEARCH_MODEL: ${OPENAI_SEARCH_MODEL:-gpt-5.2}
  OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
  OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
  OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-nova}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  AI_HOTEL_PROVIDER: ${AI_HOTEL_PROVIDER:-openai}
  TECH_API_ENABLED: ${TECH_API_ENABLED:-false}
  TECH_API_MODE: ${TECH_API_MODE:-production}
  TECH_API_BASE_URL: ${TECH_API_BASE_URL:-}
  TECH_API_LOGIN: ${TECH_API_LOGIN:-}
  TECH_API_PASSWORD: ${TECH_API_PASSWORD:-}
  TECH_API_KEY: ${TECH_API_KEY:-}
  TECH_API_TIMEOUT_MS: ${TECH_API_TIMEOUT_MS:-30000}
  TECH_API_DEFAULT_COMPANY_ID: ${TECH_API_DEFAULT_COMPANY_ID:-}
  TECH_API_DEFAULT_SYSTEMS: ${TECH_API_DEFAULT_SYSTEMS:-}
  TECH_API_HOTEL_SUPPLIERS: ${TECH_API_HOTEL_SUPPLIERS:-}
  TECH_API_TOKEN_CACHE_TTL_SECONDS: ${TECH_API_TOKEN_CACHE_TTL_SECONDS:-900}
  TECH_REPORTS_ENABLED: ${TECH_REPORTS_ENABLED:-false}
  TECH_REPORTS_BASE_URL: ${TECH_REPORTS_BASE_URL:-}
  TECH_REPORTS_KEY: ${TECH_REPORTS_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  migrate:
    image: ${BBT_IMAGE:-bbt-corporativo}:${APP_VERSION:?Defina APP_VERSION}
    build:
      context: .
      target: runtime
    environment:
      <<: *app-environment
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Defina MIGRATION_DATABASE_URL}
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE:?Defina DATABASE_APP_ROLE}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Defina DATABASE_APP_PASSWORD}
    command: ["node", "scripts/migrate.mjs", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    image: ${BBT_IMAGE:-bbt-corporativo}:${APP_VERSION:?Defina APP_VERSION}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
    volumes:
      - app_files:/var/lib/bbt/files
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-64MB}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
      - private
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  bootstrap:
    image: ${BBT_IMAGE:-bbt-corporativo}:${APP_VERSION:?Defina APP_VERSION}
    profiles: ["bootstrap"]
    environment:
      <<: *app-environment
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:?Defina BOOTSTRAP_TENANT_NAME}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:?Defina BOOTSTRAP_TENANT_SLUG}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?Defina BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Defina BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_PLATFORM_ADMIN: ${BOOTSTRAP_PLATFORM_ADMIN:-true}
      BOOTSTRAP_PLAN_KEY: ${BOOTSTRAP_PLAN_KEY:?Defina BOOTSTRAP_PLAN_KEY}
      BOOTSTRAP_PLAN_NAME: ${BOOTSTRAP_PLAN_NAME:?Defina BOOTSTRAP_PLAN_NAME}
      BOOTSTRAP_MAX_USERS: ${BOOTSTRAP_MAX_USERS:-}
      BOOTSTRAP_MAX_STORAGE_BYTES: ${BOOTSTRAP_MAX_STORAGE_BYTES:-}
      BOOTSTRAP_MAX_MONTHLY_OPERATIONS: ${BOOTSTRAP_MAX_MONTHLY_OPERATIONS:-}
      BOOTSTRAP_ENTITLEMENTS: ${BOOTSTRAP_ENTITLEMENTS:-{}}
    command: ["node", "scripts/bootstrap.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:16.8-alpine3.21
    profiles: ["ops"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      BACKUP_ROOT: /backups
      STORAGE_ROOT: /source-files
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - app_files:/source-files:ro
      - backup_data:/backups
      - ./scripts:/opt/bbt/scripts:ro
    entrypoint: ["/bin/sh", "/opt/bbt/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    security_opt:
      - no-new-privileges:true

  restore-validation:
    image: postgres:16.8-alpine3.21
    profiles: ["restore"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      RESTORE_SOURCE: ${RESTORE_SOURCE:-/backups/RESTORE_SOURCE_REQUIRED}
      RESTORE_DATABASE: ${RESTORE_DATABASE:-bbt_restore_validation}
      RESTORE_STORAGE_ROOT: /restore-validation
      ALLOW_PRODUCTION_RESTORE: "NO"
    volumes:
      - backup_data:/backups:ro
      - restore_validation_files:/restore-validation
      - ./scripts:/opt/bbt/scripts:ro
    entrypoint: ["/bin/sh", "/opt/bbt/scripts/restore.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  private:

volumes:
  postgres_data:
  app_files:
  caddy_data:
  caddy_config:
  backup_data:
  restore_validation_files: